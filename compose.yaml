services:
  postgres:
    image: postgres:16-alpine
    container_name: tickcore-postgres
    environment:
      POSTGRES_DB: tickcore_booking
      POSTGRES_USER: tickcore
      POSTGRES_PASSWORD: sapassword
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: